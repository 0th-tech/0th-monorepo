[workspace]
members = ["account", "verifier"]

# garaga's tag must be the local garaga version, which generated the verifier, and snforge_std the
# local snforge version
[workspace.dependencies]
garaga = { git = "https://github.com/keep-starknet-strange/garaga.git", tag = "v1.1.0" }
starknet = "2.18.0"
openzeppelin_account = "4.0.1"
openzeppelin_interfaces = "2.2.0"
openzeppelin_introspection = "4.0.1"
openzeppelin_utils = "2.2.0"
snforge_std = "0.64.1"
assert_macros = "2.18.0"

[workspace.scripts]
test = "snforge test"

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[[target.starknet-contract]]
