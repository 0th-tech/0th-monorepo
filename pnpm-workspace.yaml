  - chains/*/contracts
  - chains/*/sdk
  - chains/*/e2e
  - services/*
  - examples/*

catalog:
  "@types/node": ^26.6.6
  garaga: 1.1.0
  prettier: 3.10.1
  snarkjs: 0.7.6
  starknet: 10.8.0
