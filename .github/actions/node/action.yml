name: node
description: Node and pnpm at the repo's versions, and the workspace's dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
